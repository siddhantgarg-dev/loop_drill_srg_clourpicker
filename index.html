<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loop</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
}

.loop {
  --colour: #D3D6DA;

  position: relative;
  width: 100%;
  height: 100vh;
  min-height: 280px;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;
  background: transparent;
}


/* SOFT COLOUR GLOW */

.glow {
  position: absolute;
  z-index: 0;

  width: min(76vw, 980px);
  height: min(42vw, 500px);

  border-radius: 50%;

  background: var(--colour);
  opacity: .28;

  filter: blur(65px);

  transition:
    background .65s ease,
    opacity .65s ease;

  pointer-events: none;
}


/* LARGE FROSTED GLASS TYPE */

.colour-name {
  position: absolute;
  z-index: 1;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%, -53%)
    scale(1);

  width: 92%;

  text-align: center;

  font-family:
    Arial Black,
    Helvetica,
    sans-serif;

  font-size: clamp(90px, 15vw, 230px);
  font-weight: 900;

  line-height: .78;
  letter-spacing: -0.085em;

  white-space: nowrap;

  color: rgba(255,255,255,.32);

  -webkit-text-fill-color: rgba(255,255,255,.30);

  -webkit-text-stroke:
    1.5px rgba(255,255,255,.72);

  text-shadow:
    0 1px 0 rgba(255,255,255,.95),
    0 4px 12px rgba(255,255,255,.35),
    0 12px 30px rgba(0,0,0,.06);

  filter:
    drop-shadow(0 2px 3px rgba(255,255,255,.5));

  transition:
    color .6s ease,
    -webkit-text-fill-color .6s ease,
    transform .45s cubic-bezier(.22,.61,.36,1),
    filter .6s ease;

  pointer-events: none;
}


/* SOFT FROSTED INNER EDGE */

.colour-name::after {
  content: attr(data-name);

  position: absolute;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  color: transparent;

  -webkit-text-stroke:
    5px rgba(255,255,255,.12);

  filter: blur(3px);

  pointer-events: none;
}


/* DRILL */

.product {
  position: relative;
  z-index: 2;

  width: min(78vw, 1050px);
  aspect-ratio: 16 / 9;

  isolation: isolate;
}

.render {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: contain;

  user-select: none;
  -webkit-user-drag: none;
}


/* LIQUID GLASS SELECTOR */

.selector {
  position: absolute;
  z-index: 4;

  left: 50%;
  bottom: 7%;

  transform: translateX(-50%);

  display: flex;
  align-items: center;

  gap: 13px;

  padding: 6px 10px;

  border: 1px solid rgba(255,255,255,.9);
  border-radius: 999px;

  background: rgba(255,255,255,.38);

  box-shadow:
    inset 0 1px 1px rgba(255,255,255,.95),
    0 7px 25px rgba(0,0,0,.055);

  backdrop-filter:
    blur(18px)
    saturate(125%);

  -webkit-backdrop-filter:
    blur(18px)
    saturate(125%);
}

button {
  appearance: none;
  -webkit-appearance: none;

  width: 18px;
  height: 18px;

  padding: 0;
  border: 0;
  border-radius: 50%;

  background: var(--swatch);

  cursor: pointer;

  box-shadow:
    inset 0 1px 2px rgba(255,255,255,.75),
    0 1px 3px rgba(0,0,0,.08);

  transition:
    transform .2s ease,
    box-shadow .2s ease;
}

button:hover {
  transform: scale(1.12);
}

button.active {
  transform: scale(1.17);

  box-shadow:
    0 0 0 2px rgba(255,255,255,.96),
    0 0 0 3px rgba(80,80,80,.16),
    inset 0 1px 2px rgba(255,255,255,.75);
}


/* TABLET */

@media (max-width: 900px) {

  .loop {
    height: 430px;
    min-height: 430px;
  }

  .product {
    width: 92vw;
  }

  .glow {
    width: 90vw;
    height: 45vw;
    filter: blur(55px);
  }

  .colour-name {
    width: 100%;
    font-size: clamp(70px, 14vw, 150px);
  }

  .selector {
    bottom: 5%;
  }
}


/* PHONE */

@media (max-width: 600px) {

  .loop {
    height: 300px;
    min-height: 300px;
  }

  .product {
    width: 100vw;
    max-width: none;
  }

  .glow {
    width: 100vw;
    height: 55vw;

    filter: blur(42px);
    opacity: .22;
  }

  .colour-name {
    width: 115%;

    font-size: 72px;

    letter-spacing: -0.08em;

    -webkit-text-stroke:
      1px rgba(255,255,255,.65);
  }

  .selector {
    bottom: 4%;
    gap: 10px;
    padding: 5px 8px;
  }

  button {
    width: 15px;
    height: 15px;
  }
}


/* SMALL PHONE */

@media (max-width: 400px) {

  .loop {
    height: 260px;
    min-height: 260px;
  }

  .colour-name {
    font-size: 58px;
  }

  .selector {
    bottom: 3%;
  }

  button {
    width: 14px;
    height: 14px;
  }
}
</style>
</head>


<body>

<div class="loop" id="loop">

  <div class="glow"></div>


  <!-- GLASS TYPE BEHIND THE DRILL -->

  <div
    class="colour-name"
    id="colourName"
    data-name="Light Grey">
    Light Grey
  </div>


  <!-- DRILL -->

  <div class="product">

    <img
      id="flat"
      class="render"
      src="black-flat.png"
      alt="Loop drill">

  </div>


  <!-- COLOUR SELECTOR -->

  <div class="selector">

    <button
      class="active"
      data-colour="black"
      data-bg="#D3D6DA"
      data-name="Light Grey"
      style="--swatch:#D3D6DA"
      aria-label="Light Grey">
    </button>

    <button
      data-colour="green"
      data-bg="#A9D9C2"
      data-name="Sage Green"
      style="--swatch:#A9D9C2"
      aria-label="Sage Green">
    </button>

    <button
      data-colour="yellow"
      data-bg="#F0D65C"
      data-name="Butter Yellow"
      style="--swatch:#F0D65C"
      aria-label="Butter Yellow">
    </button>

    <button
      data-colour="purple"
      data-bg="#C9B1E4"
      data-name="Lilac Purple"
      style="--swatch:#C9B1E4"
      aria-label="Lilac Purple">
    </button>

    <button
      data-colour="coral"
      data-bg="#F0B09F"
      data-name="Coral"
      style="--swatch:#F0B09F"
      aria-label="Coral">
    </button>

    <button
      data-colour="blue"
      data-bg="#A9C7ED"
      data-name="Light Blue"
      style="--swatch:#A9C7ED"
      aria-label="Light Blue">
    </button>

  </div>

</div>


<script>

const loop =
  document.getElementById('loop');

const flat =
  document.getElementById('flat');

const colourName =
  document.getElementById('colourName');

const buttons =
  [...document.querySelectorAll(
    '.selector button'
  )];

let current = 'black';


buttons.forEach(btn => {

  btn.addEventListener('click', () => {

    const colour =
      btn.dataset.colour;

    if (colour === current) {
      return;
    }


    buttons.forEach(button => {
      button.classList.remove('active');
    });

    btn.classList.add('active');


    const nextImage =
      new Image();


    nextImage.onload = () => {

      flat.src =
        nextImage.src;


      loop.style.setProperty(
        '--colour',
        btn.dataset.bg
      );


      colourName.textContent =
        btn.dataset.name;

      colourName.dataset.name =
        btn.dataset.name;


      current =
        colour;


      colourName.style.transform =
        'translate(-50%, -53%) scale(.97)';


      requestAnimationFrame(() => {

        setTimeout(() => {

          colourName.style.transform =
            'translate(-50%, -53%) scale(1)';

        }, 80);

      });

    };


    nextImage.src =
      colour + '-flat.png';

  });

});

</script>

</body>
</html>
