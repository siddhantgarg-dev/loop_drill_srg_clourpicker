<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loop</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
.loop{
  --colour:#25262A;
  position:relative;width:100%;height:100vh;min-height:280px;
  display:flex;align-items:center;justify-content:center;
  background:transparent;overflow:hidden;
}
.glow{
  position:absolute;z-index:0;width:min(76vw,980px);height:min(42vw,500px);
  border-radius:50%;background:var(--colour);opacity:.17;
  filter:blur(70px);transition:background .65s ease,opacity .65s ease;
  pointer-events:none;
}
.product{
  position:relative;z-index:1;width:min(78vw,1050px);aspect-ratio:16/9;
  cursor:pointer;isolation:isolate;
}
.render{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;user-select:none;-webkit-user-drag:none;
  will-change:opacity,transform,filter;
}
.flat{
  opacity:1;
  transform:scale(1);
  filter:blur(0);
  transition:
    opacity .30s cubic-bezier(.4,0,1,1),
    transform .42s cubic-bezier(.22,.61,.36,1),
    filter .30s ease;
}
.hover{
  opacity:0;
  transform:scale(.965) translate3d(0,8px,0);
  filter:blur(5px);
  transition:
    opacity .48s cubic-bezier(.16,1,.3,1) .13s,
    transform .62s cubic-bezier(.16,1,.3,1),
    filter .48s ease .13s;
}
.product.is-hovering .flat{
  opacity:0;
  transform:scale(.985) translate3d(0,-4px,0);
  filter:blur(3px);
}
.product.is-hovering .hover{
  opacity:1;
  transform:scale(1) translate3d(0,0,0);
  filter:blur(0);
}
.selector{
  position:absolute;z-index:4;left:50%;bottom:7%;
  transform:translateX(-50%);
  display:flex;align-items:center;gap:13px;padding:6px 10px;
  border:1px solid rgba(255,255,255,.9);border-radius:999px;
  background:rgba(255,255,255,.38);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.95),0 7px 25px rgba(0,0,0,.055);
  backdrop-filter:blur(18px) saturate(125%);
  -webkit-backdrop-filter:blur(18px) saturate(125%);
}
button{
  appearance:none;-webkit-appearance:none;width:18px;height:18px;
  padding:0;border:0;border-radius:50%;background:var(--swatch);cursor:pointer;
  box-shadow:inset 0 1px 2px rgba(255,255,255,.75),0 1px 3px rgba(0,0,0,.08);
  transition:transform .2s ease,box-shadow .2s ease;
}
button:hover{transform:scale(1.12)}
button.active{
  transform:scale(1.17);
  box-shadow:0 0 0 2px rgba(255,255,255,.96),0 0 0 3px rgba(80,80,80,.16),
             inset 0 1px 2px rgba(255,255,255,.75);
}
@media(max-width:600px){
  .product{width:96vw}
  .glow{width:96vw;height:52vw;filter:blur(45px)}
  .selector{bottom:4%;gap:11px;padding:5px 9px}
  button{width:16px;height:16px}
}
</style>
</head>
<body>
<div class="loop" id="loop">
  <div class="glow"></div>
  <div class="product" id="product">
    <img id="flat" class="render flat" src="black-flat.png" alt="Loop drill">
    <img id="hover" class="render hover" src="black-hover.png" alt="">
  </div>
  <div class="selector">
    <button class="active" data-colour="black" data-bg="#25262A" style="--swatch:#25262A" aria-label="Black"></button>
    <button data-colour="blue" data-bg="#A9C7ED" style="--swatch:#A9C7ED" aria-label="Blue"></button>
    <button data-colour="green" data-bg="#A9D9C2" style="--swatch:#A9D9C2" aria-label="Green"></button>
    <button data-colour="coral" data-bg="#F0B09F" style="--swatch:#F0B09F" aria-label="Coral"></button>
    <button data-colour="purple" data-bg="#C9B1E4" style="--swatch:#C9B1E4" aria-label="Purple"></button>
    <button data-colour="yellow" data-bg="#F0D65C" style="--swatch:#F0D65C" aria-label="Yellow"></button>
  </div>
</div>
<script>
const loop=document.getElementById('loop');
const product=document.getElementById('product');
const flat=document.getElementById('flat');
const hover=document.getElementById('hover');
const buttons=[...document.querySelectorAll('.selector button')];
let current='black';
let hovering=false;

product.addEventListener('pointerenter',()=>{
  hovering=true;
  product.classList.add('is-hovering');
});
product.addEventListener('pointerleave',()=>{
  hovering=false;
  product.classList.remove('is-hovering');
});

buttons.forEach(btn=>{
  btn.addEventListener('click',()=>{
    const c=btn.dataset.colour;
    if(c===current)return;
    buttons.forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');

    // Temporarily return to the flat state while loading both new poses.
    product.classList.remove('is-hovering');

    const nextFlat=new Image(), nextHover=new Image();
    let loaded=0;
    const ready=()=>{
      loaded++;
      if(loaded<2)return;
      flat.src=nextFlat.src;
      hover.src=nextHover.src;
      loop.style.setProperty('--colour',btn.dataset.bg);
      current=c;
      if(hovering) requestAnimationFrame(()=>product.classList.add('is-hovering'));
    };
    nextFlat.onload=ready;
    nextHover.onload=ready;
    nextFlat.src=c+'-flat.png';
    nextHover.src=c+'-hover.png';
  });
});
</script>
</body>
</html>
